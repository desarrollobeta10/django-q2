name: Test django-q2 (Beta10)

on:
  push:
    branches:
      - master
    tags:
      - "rev-beta10-*"
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Tests (Python 3.12, Django 5.2, ${{ matrix.codigo }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        codigo:
          - rama
          - rev-beta10-3

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server
      mongodb:
        image: mongo
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Usar el código de rev-beta10-3
        if: matrix.codigo == 'rev-beta10-3'
        run: |
          git fetch --depth=1 origin tag rev-beta10-3
          git checkout rev-beta10-3 -- django_q pyproject.toml
          rm django_q/tests/test_close_connections.py

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias con Django 5.2
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testing]" "django~=5.2.0" "blessed>=1.19.1,<1.21" "pytest>=7.1.3,<8" "pytest-django>=4.5.2,<5" "pytest-timeout>=2.3,<3"

      - name: Tests de django-q2
        run: timeout --signal=ABRT 300 python -X faulthandler -m pytest -v --timeout=120 --durations=15
        env:
          REDIS_HOST: "127.0.0.1"
          MONGO_HOST: "127.0.0.1"

      - name: Procesos que siguen vivos
        if: always()
        run: ps -eo pid,ppid,etime,stat,cmd --forest | grep -v "ps -eo" | grep -i -E "python|pytest" || true
