name: Test django-q2 (Beta10)

on:
  push:
    branches:
      - master
    tags:
      - "rev-beta10-*"
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Tests (Python 3.12, Django 5.2)
    runs-on: ubuntu-26.04

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server
      mongodb:
        image: mongo
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias con Django 5.2
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testing]" "django~=5.2.0" "pytest>=7.1.3,<8" "pytest-django>=4.5.2,<5"

      - name: Tests de django-q2
        run: pytest
        env:
          REDIS_HOST: "127.0.0.1"
          MONGO_HOST: "127.0.0.1"
