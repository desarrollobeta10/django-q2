name: Test django-q2 (Beta10)

on:
  push:
    branches:
      - master
    tags:
      - "rev-beta10-*"
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Tests (${{ matrix.linea }}, Python ${{ matrix.python-version }}, Django ${{ matrix.django }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - linea: producción
            python-version: "3.9"
            django: "4.2"
            runs-on: ubuntu-24.04
          - linea: desarrollo
            python-version: "3.12"
            django: "5.2"
            runs-on: ubuntu-26.04

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server
      mongodb:
        image: mongo
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias con Django ${{ matrix.django }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testing]" "django~=${{ matrix.django }}.0" "pytest>=7.1.3,<8" "pytest-django>=4.5.2,<5"

      - name: Tests de django-q2
        run: pytest
        env:
          REDIS_HOST: "127.0.0.1"
          MONGO_HOST: "127.0.0.1"
